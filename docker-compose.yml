services:
  # ============================================================
  # POSTGRES DATABASE
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: intelligent_workspace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workspace_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workspace_net

  # ============================================================
  # FASTAPI BACKEND
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelligent_workspace_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-workspace_db}
      SECRET_KEY: ${SECRET_KEY:-production_super_secret_jwt_key_please_change_in_prod}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    ports:
      - "8000:8000"
    networks:
      - workspace_net

  # ============================================================
  # REACT / VITE / NGINX FRONTEND
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelligent_workspace_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - workspace_net

networks:
  workspace_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
